<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Habitrix</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #000; color: #fff; line-height: 1.6;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }
    .card {
      max-width: 560px; width: 100%; text-align: center;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px; padding: 40px 28px;
    }
    h1 { font-size: 40px; letter-spacing: -1px; margin-bottom: 12px; }
    p.tagline { color: rgba(255,255,255,0.6); font-size: 18px; margin-bottom: 28px; }
    .links { display: flex; flex-direction: column; gap: 12px; }
    a.btn {
      display: block; padding: 14px; border-radius: 14px;
      text-decoration: none; color: #fff; font-weight: 600;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
    }
    .contact { margin-top: 28px; color: rgba(255,255,255,0.55); font-size: 14px; }
    .contact a { color: #fff; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Habitrix</h1>
    <p class="tagline">Трекер привычек, который держит тебя в тонусе — в одиночку и в команде.</p>
    <div class="links">
      <a class="btn" href="/privacy.html">Политика конфиденциальности</a>
      <a class="btn" href="/terms.html">Условия использования</a>
    </div>
    <p class="contact">
      Поддержка: <a href="mailto:yerlanaubakirovvv@gmail.com">yerlanaubakirovvv@gmail.com</a>
    </p>
  </div>
</body>
</html>
